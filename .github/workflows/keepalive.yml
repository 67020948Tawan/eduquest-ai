name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: |
          curl -s -m 45 --retry 2 --retry-delay 10 \
            https://eduquest-api-natl.onrender.com/ || true
